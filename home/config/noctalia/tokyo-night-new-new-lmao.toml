[appearance.theme]
palette_source = "wallpaper"

[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.67999998480081558
    capsule = true
    capsule_border_width = 1.5
    capsule_opacity = 0.91999997943639755
    center = [ "group:g3", "group:g5", "group:g7" ]
    concave_edge_corners = false
    end = [ "group:g4", "group:g6", "group:g2", "group:g8", "session" ]
    margin_edge = 8
    margin_ends = 9
    radius = 22
    start = [ "launcher", "group:g1", "taskbar" ]
    thickness = 45

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "wallpaper", "wallhaven" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "start"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "battery", "brightness", "volume" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g3"
        members = [ "cat", "ram" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "start"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "tray_group_icon", "tray" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_container"
        id = "g5"
        members = [ "audio_visualizer", "media" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g6"
        members = [ "network", "bluetooth" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g7"
        members = [ "group_icon", "launcher_2", "widget_5", "status_2", "vpn_widget", "toggle_2", "bar", "bar_2", "status" ]
        opacity = 0.91999995708465576
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_container"
        id = "g8"
        members = [ "notifications", "keyboard_layout", "clock", "control-center" ]
        opacity = 0.91999995708465576
        padding = 6.0

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "bluetooth"

[dock]
background_opacity = 0.68999998457729816
concave_edge_corners = false
enabled = true
icon_size = 38
inactive_opacity = 0.99999997764825821
launcher_position = "start"
margin_edge = 8
pinned = [ "code", "firefox", "org.gnome.Nautilus", "kitty", "dev.zed.Zed" ]
radius = 32
reserve_space = true
show_dots = true
smart_auto_hide = false

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]

[location]
address = "Moscow, Russia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DVI-D-1" ]

    [lockscreen_widgets.grid]

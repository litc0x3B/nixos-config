[appearance.theme]
palette_source = "wallpaper"

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.51999998837709427
    capsule = true
    capsule_opacity = 0.79999998211860657
    center = [ "clock", "cpu", "ram", "wallhaven", "current" ]
    concave_edge_corners = false
    end = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "brightness",
        "keyboard_layout",
        "battery",
        "control-center",
        "session"
    ]
    margin_edge = 9
    margin_ends = 120
    start = [ "launcher", "wallpaper", "workspaces", "group:g1" ]
    thickness = 44

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "widget", "volume", "media", "audio_visualizer" ]
        opacity = 0.79999995231628418
        padding = 22.0

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[dock]
background_opacity = 0.4999999888241291
concave_edge_corners = false
enabled = true
inactive_opacity = 0.99999997764825821
launcher_position = "start"
margin_edge = 14
pinned = [ "code", "firefox", "org.gnome.Nautilus", "kitty" ]
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.00006103515625
    cy = 897.99981689453125
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.4999999888241291

[osd]
background_opacity = 0.4999999888241291

[plugin_settings."aabidk20/yt-music"]
mini_open_near_click = true

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true
browser_placement = "floating"

[plugins]
enabled = [ "noctalia/wallhaven", "tordex/nvtop", "yocraft/desktop-launcher", "aabidk20/yt-music" ]

[shell]
external_ip_enabled = true
polkit_agent = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    transparency_mode = "solid"
    wallpaper_placement = "floating"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/litc/Pictures/Screenshots"
    remember_last_region = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Nord"
community_palette = "Breeze"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "antigravity", "pywalfox-beta4", "discord", "telegram", "obsidian", "vscode", "heroiclauncher", "yazi" ]

[wallpaper.default]
path = "/home/litc/Pictures/740164.png"

[wallpaper.last]
path = "/home/litc/Pictures/740164.png"

[wallpaper.monitors.Virtual-1]
path = "/home/litc/Pictures/740164.png"

[widget.audio_visualizer]
show_when_idle = true
width = 90

[widget.current]
type = "thaer99ob/default-apps:current"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "aabidk20/yt-music:widget"
